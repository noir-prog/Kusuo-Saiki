<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kusuo Saiki</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: #1b1b1b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 Kusuo Saiki</h1>

    <div class="card">
        <p>
            Добро пожаловать,
            <span id="user-name">пользователь</span> 👋
        </p>

        <p>
            Статус:
            <span class="status">ONLINE</span>
        </p>
    </div>

</div>

<script>
    // ================== TELEGRAM WEB APP ==================

    const tg = window.Telegram.WebApp;

    tg.ready();

    const user = tg.initDataUnsafe?.user;


    // ================== USER DATA ==================

    if (user) {

        const userName =
            user.first_name ||
            user.username ||
            "пользователь";

        document.getElementById(
            "user-name"
        ).textContent = userName;


        console.log(
            "Telegram User ID:",
            user.id
        );

        console.log(
            "Telegram Username:",
            user.username
        );

        console.log(
            "Telegram First Name:",
            user.first_name
        );

        console.log(
            "Telegram Last Name:",
            user.last_name
        );

        console.log(
            "Telegram Language:",
            user.language_code
        );

    } else {

        console.log(
            "Telegram User: не найден"
        );

    }
</script>

</body>
</html>
