<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kusuo Saiki</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: #1b1b1b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .status {
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 Kusuo Saiki</h1>

    <div class="card">
        <p>
            Добро пожаловать,
            <span id="user-name">пользователь</span> 👋
        </p>

        <p>
            Статус:
            <span class="status">ONLINE</span>
        </p>
    </div>

</div>

<script>
    // ================== TELEGRAM WEB APP ==================

    const tg = window.Telegram.WebApp;

    tg.ready();


    // ================== USER DATA ==================

    const user = tg.initDataUnsafe?.user;

    if (user) {

        const userName =
            user.first_name ||
            user.username ||
            "пользователь";

        document.getElementById(
            "user-name"
        ).textContent = userName;

    }


    // ================== SERVER AUTH ==================

    async function authenticateWithServer() {

        try {

            const response = await fetch(
                "https://kusuo-saiki.onrender.com/miniapp/auth",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                    },

                    body: JSON.stringify({
                        initData: tg.initData,
                    }),
                }
            );


            const result = await response.json();


            console.log(
                "Server authentication:",
                result
            );


            if (result.ok) {

                console.log(
                    "SERVER VERIFIED USER ID:",
                    result.user.id
                );

            } else {

                console.error(
                    "SERVER AUTH ERROR:",
                    result.error
                );

            }

        } catch (error) {

            console.error(
                "SERVER CONNECTION ERROR:",
                error
            );

        }

    }


    // ================== START AUTH ==================

    authenticateWithServer();
</script>

</body>
</html>
